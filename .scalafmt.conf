version = 3.11.5
runner.dialect = scala3
maxColumn = 120

rewrite {
  rules = [
    Imports
  ]

  imports {
    expand = false
    sort = ascii
    groups = [
      ["gears\\..*"],
      ["java.?\\..*", "scala\\..*"],
    ]
  }
}

project.excludePaths = [
  "glob:**/io/native/src/main/scala/gears/io/unsafe/PosixErr.scala",
  "glob:**/io/native/src/main/scala/gears/io/unsafe/PosixFileOps.scala"
]
